name: FrankenPatents
options:
  bundleIdPrefix: com.frankenpatents
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  FrankenPatents:
    build:
      targets:
        FrankenPatents: all
        FrankenPatentsTests: [test]
    test:
      targets:
        - FrankenPatentsTests

targets:
  FrankenPatents:
    type: application
    platform: iOS
    entitlements:
      path: FrankenPatents.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenpatents.FrankenPatents
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        MACCATALYST_USE_NATIVE_DESIGN: true
    sources:
      - path: Sources
        excludes:
          # Superseded by PatentRootView + PatentWorkstationView. Preserve the
          # historical source file, but keep its direct third-party Link surface
          # out of the offline-first native product.
          - PatentDetailView.swift
      - path: Assets.xcassets
      - path: Resources
        buildPhase: resources
    postBuildScripts:
      - name: Bundle native patent archive assets
        script: |
          set -euo pipefail
          SOURCE_ARCHIVE="${SRCROOT}/../public/patents/"
          BUNDLE_ARCHIVE="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/patents/"
          mkdir -p "${BUNDLE_ARCHIVE}"
          rsync -a --exclude='*.pdf' "${SOURCE_ARCHIVE}" "${BUNDLE_ARCHIVE}"
        inputFiles:
          - $(SRCROOT)/../public/patents
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FrankenPatents
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: MonsterIcon
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.reference

  FrankenPatentsTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenpatents.FrankenPatentsTests
        GENERATE_INFOPLIST_FILE: true
    sources:
      - path: Tests
    dependencies:
      - target: FrankenPatents
